name: Keep Alive Supabase CSDL PHAN MEM KIEM TRA TRUC TUYEN

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi 1 giờ (phút thứ 0)
  workflow_dispatch:     # Cho phép bạn bấm nút chạy thủ công để kiểm tra

jobs:
  ping-site:
    runs-on: ubuntu-latest
    steps:
      - name: Access Website to Trigger Heartbeat
        run: |
          # Gửi request đến trang web của bạn
          curl -s -L https://kiemtratructuyen.vercel.app > /dev/null
          echo "Đã truy cập https://kiemtratructuyen.vercel.app thành công lúc $(date)"
