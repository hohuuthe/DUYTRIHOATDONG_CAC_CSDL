          curl -s -X GET "https://gziygcguktozutpednsq.supabase.co/rest/v1/duytricsdl?limit=1" \
            -H "apikey: sb_publishable_jUZZ46kQJfnm6hrskFCa7Q_MfQn3Gnk" \
